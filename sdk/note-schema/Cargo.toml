[package]
name = "miden-note-schema"
description = "Host-side reader and codec registry for Miden note storage schemas"
version = "0.15.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[features]
default = ["protocol"]
# Values of protocol types: `NoteStorage`, its builder and decoder, and the standard codecs.
# The schema model and the codec-component validation do not need it.
protocol = ["miden-schema/protocol", "dep:miden-protocol"]
codec-component = ["protocol", "miden-schema/codec-component"]

[lib]
doctest = false

[dependencies]
miden-mast-package = { workspace = true, features = ["std"] }
miden-protocol = { workspace = true, features = ["std"], optional = true }
miden-schema.workspace = true
midenc-frontend-wasm-metadata.workspace = true

[dev-dependencies]
midenc-integration-test-support.workspace = true
