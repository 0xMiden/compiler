[package]
name = "miden-tx-script-args"
description = "Typed transaction-script argument transport for the Miden VM"
version = "0.14.0-rc.1"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
miden-field = { workspace = true, default-features = false }
miden-field-repr.workspace = true

# The guest-side decode transport (advice provider access and VM asserts) is only needed when
# compiling for the Miden VM; off-chain consumers never build the on-chain bindings.
[target.'cfg(target_family = "wasm")'.dependencies]
miden-stdlib-sys.workspace = true

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(miden)"] }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
additional-targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
