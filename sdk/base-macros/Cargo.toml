[package]
name = "miden-base-macros"
description = "Provides proc macro support for Miden rollup SDK"
version = "0.14.0-rc.1"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
proc-macro = true
doctest = false

[features]
default = []
internal-wit-emit = ["dep:wit-component"]

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
miden-assembly-syntax.workspace = true
miden-mast-package.workspace = true
miden-protocol.workspace = true
miden-project.workspace = true
miden-debug-types.workspace = true
semver.workspace = true
toml.workspace = true
syn.workspace = true
heck.workspace = true
miden-formatting.workspace = true
midenc-frontend-wasm-metadata.workspace = true
wit-bindgen-core = "0.57"
wit-bindgen-rust = { version = "0.57", default-features = false }
wit-component = { workspace = true, optional = true }

# Version floor only, never imported. This proc macro is the one host-compiled dependency of
# every guest project, and through `miden-protocol` it builds the native backend of
# `miden-field`. `miden-field` 0.29 declares `p3-field`/`p3-goldilocks` as "0.6" but only
# compiles against 0.6.3+ (where plonky3 moved to `num-bigint` 0.5), so a resolution that lands
# on p3 0.6.0-0.6.2 (for example from a stale local registry index) fails to build
# `miden-field`.
# TODO: remove these pins once a miden-field release raises its p3 requirements to >= 0.6.3
# (https://github.com/0xMiden/miden-vm/issues/3536).
# p3-field = { version = "0.6.3", default-features = false }
# p3-goldilocks = { version = "0.6.3", default-features = false }

[dev-dependencies]
# NOTE: Use local paths for dev-only dependency to avoid relying on crates.io during packaging
miden-protocol = { workspace = true, features = ["std"] }
miden-field.workspace = true
miden-field-repr.workspace = true
wit-component.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
additional-targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]

[package.metadata.cargo-shear]
# The p3 dependencies are a version floor for miden-field's native backend, not imports.
ignored = ["p3-field", "p3-goldilocks"]
