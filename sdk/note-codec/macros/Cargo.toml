[package]
name = "miden-note-codec-macros"
description = "Procedural macros for author-side Miden note codecs"
version = "0.14.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
publish = false

[lib]
proc-macro = true
doctest = false

[dependencies]
heck.workspace = true
miden-mast-package = { workspace = true, features = ["std"] }
miden-note-schema.workspace = true
miden-note-schema-codegen.workspace = true
proc-macro2.workspace = true
proc-macro-crate = "3.5"
quote.workspace = true
syn = { workspace = true, features = ["visit-mut"] }

[dev-dependencies]
prettyplease = "0.2"
