[package]
name = "miden-bindings"
description = "Typed host bindings for Miden package schemas"
version = "0.15.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
miden-account-storage-schema = { workspace = true, features = ["protocol"] }
miden-bindings-macros.workspace = true
miden-field.workspace = true
miden-field-repr.workspace = true
miden-note-schema = { workspace = true, features = ["protocol"] }
miden-protocol = { workspace = true, features = ["std"] }
miden-schema = { workspace = true, features = ["protocol"] }

[dev-dependencies]
miden-mast-package = { workspace = true, features = ["std"] }
midenc-frontend-wasm-metadata.workspace = true
midenc-integration-test-support.workspace = true
tempfile.workspace = true
