[package]
name = "miden-base-sys"
description = "Miden rollup Rust bingings and MASM library"
version = "0.15.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
build = "build.rs"
links = "miden_base_sys_stubs"

[lib]
doctest = false

[dependencies]
miden-field-repr.workspace = true
miden-intrinsics-sys.workspace = true
miden-stdlib-sys.workspace = true

[dev-dependencies]
# `tests/generated.rs` regenerates `src/raw/{protocol,standards}.rs` and
# `stubs/{protocol,standards}.rs` from the toolchain's packages and compares them with the
# committed files.
miden-sdk-bindgen.workspace = true
midenc-integration-test-support.workspace = true
midenc-package-interface.workspace = true
# The differential test of `AssetAmount` in `src/bindings/types.rs`.
miden-protocol.workspace = true

[build-dependencies]
miden-sdk-build-script-support.workspace = true

[features]
default = []

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
additional-targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]

[package.metadata.cargo-shear]
ignored-paths = ["stubs/*.rs"]
