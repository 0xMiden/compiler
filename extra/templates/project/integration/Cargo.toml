[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
# TODO: switch back to crates.io releases once a Miden client compatible with
# protocol 0.17.0-rc.4 is published (tracked in 0xMiden/rust-sdk#2530).
miden-client = { git = "https://github.com/0xMiden/rust-sdk", rev = "590ca464903e269521d8ac24cc43361a01ad19b6", features = ["tonic"] }
miden-client-sqlite-store = { git = "https://github.com/0xMiden/rust-sdk", rev = "590ca464903e269521d8ac24cc43361a01ad19b6" }
miden-standards = { version = "=0.17.0-rc.4", features = ["testing"] }
miden-testing = "=0.17.0-rc.4"
miden-mast-package = { version = "0.32.1", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
anyhow = "1.0"
