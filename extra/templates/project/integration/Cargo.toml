[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
miden-client = { git = "https://github.com/0xMiden/rust-sdk", rev = "a1b18aec3163998fca181bb7a57eee084d875b37", features = ["tonic"] }
miden-client-sqlite-store = { git = "https://github.com/0xMiden/rust-sdk", rev = "a1b18aec3163998fca181bb7a57eee084d875b37", package = "miden-client-sqlite-store" }
miden-standards = { version = "=0.17.0-rc.9", features = ["testing"] }
miden-testing = "=0.17.0-rc.9"
miden-mast-package = { version = "0.35.0", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
anyhow = "1.0"
