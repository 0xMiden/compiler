[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
miden-client = { version = "0.17.0-rc.1", features = ["tonic"] }
miden-client-sqlite-store = { version = "0.17.0-rc.1", package = "miden-client-sqlite-store" }
miden-standards = { version = "=0.17.0-rc.6", features = ["testing"] }
miden-testing = "=0.17.0-rc.6"
miden-mast-package = { version = "0.33.0", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
anyhow = "1.0"
