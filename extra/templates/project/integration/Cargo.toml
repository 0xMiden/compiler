[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Temporary: the published client (0.17.0-rc.1) is built against protocol rc.5. Pinned to the
# rust-sdk rc.6 migration (https://github.com/0xMiden/rust-sdk/pull/2594) until a client release
# built on rc.6 is published.
miden-client = { git = "https://github.com/0xMiden/rust-sdk", rev = "5a13fac2a90d825451d335c3e67fd3538b3d9e52", features = ["tonic"] }
miden-client-sqlite-store = { git = "https://github.com/0xMiden/rust-sdk", rev = "5a13fac2a90d825451d335c3e67fd3538b3d9e52" }
miden-standards = { version = "=0.17.0-rc.6", features = ["testing"] }
miden-testing = "=0.17.0-rc.6"
miden-mast-package = { version = "0.33.0", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
anyhow = "1.0"
