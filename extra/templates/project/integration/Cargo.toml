[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
# TODO: switch back to crates.io releases once a Miden client compatible with
# protocol 0.17.0-rc.5 is published. The migration (0xMiden/rust-sdk#2530) is merged into the
# client's `next` branch but not released yet, so the dependencies are pinned to that merge.
miden-client = { git = "https://github.com/0xMiden/rust-sdk", rev = "2fb20aca0869034dd26aa35473dbfb14fa017083", features = ["tonic"] }
miden-client-sqlite-store = { git = "https://github.com/0xMiden/rust-sdk", rev = "2fb20aca0869034dd26aa35473dbfb14fa017083" }
miden-standards = { version = "=0.17.0-rc.5", features = ["testing"] }
miden-testing = "=0.17.0-rc.5"
miden-mast-package = { version = "0.33.0", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
anyhow = "1.0"
