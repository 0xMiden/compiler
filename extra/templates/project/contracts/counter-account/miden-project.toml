[package]
name = "counter-account"
version = "0.1.0"

[lib]
path = "src/lib.rs"
kind = "account-component"
# Miden path `<namespace>::<package>::<interface>` naming every exported procedure
# (`miden::counter_account::counter_contract::get_count`) and storage slot.
namespace = "miden::counter_account::counter_contract"

[dependencies]
miden-core = "*"
miden-protocol = "*"

[package.metadata.miden]
supported-types = ["RegularAccountImmutableCode"]
