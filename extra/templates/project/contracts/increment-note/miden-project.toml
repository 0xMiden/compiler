[package]
name = "increment-note"
version = "0.1.0"

[lib]
kind = "note"
# Notes export a package-derived interface (`miden-<package>`), matching the `#[note]` macro.
namespace = "miden:increment-note/miden-increment-note@0.1.0"
path = "src/lib.rs"

[dependencies]
miden-core = "*"
miden-protocol = "*"
counter-account = { path = "../counter-account" }
