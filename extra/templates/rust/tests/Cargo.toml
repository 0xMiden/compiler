[package]
name = "template-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
doctest = false

[dependencies]
# By path, not by version: `cargo-miden` statically links the compiler, so this
# is what makes the tests build the templates with the compiler from this
# checkout rather than a published one. The generated projects depend on the
# SDK from the same checkout, via the `--compiler-path` these tests pass.
cargo-miden = { path = "../../../../tools/cargo-miden" }

# Standalone crate: do not search parent directories for a workspace.
[workspace]
