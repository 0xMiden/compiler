[package]
name = "{{crate_name}}"
version = "0.1.0"
edition = "2024"

[lib]
# Build this crate as a self-contained, C-style dynamic library
# This is required to emit the proper Wasm module type
crate-type = ["cdylib"]

[dependencies]
# A Miden program only needs `miden-core` (declared in miden-project.toml).
# If your program needs the Miden SDK, add it here, e.g.:
#   miden = { git = "https://github.com/0xMiden/compiler", branch = "next" }

[build-dependencies]
{% if compiler_path %}
miden-sdk-build-script-support = { path = "{{ compiler_path }}/sdk/build-script-support" }
{% elsif compiler_branch %}
miden-sdk-build-script-support = { git = "https://github.com/0xMiden/compiler", branch = "{{ compiler_branch }}" }
{% elsif compiler_rev %}
miden-sdk-build-script-support = { git = "https://github.com/0xMiden/compiler", rev = "{{ compiler_rev }}" }
{% else %}
miden-sdk-build-script-support = { version = "0.14.0-rc.1" }
{% endif %}
