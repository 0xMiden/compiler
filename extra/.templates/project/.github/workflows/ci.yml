name: CI

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  integration_tests:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: |
        rustup update --no-self-update
        rustc --version
    - name: Install midenup and stable compiler components
      run: |
        set -euo pipefail
        curl -fsSL https://github.com/0xMiden/midenup/releases/latest/download/installer.sh \
          | sh -s
        midenup install
        echo "MIDENUP_HOME=$(midenup show home)" >> "$GITHUB_ENV"
        miden midenc --version
    - name: Run integration tests
      working-directory: integration
      run: |
        cargo test
