[package]
name = "cargo-miden"
description = "A cargo extension to build Miden projects"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
autotests = false                                         # disable autodiscovery of tests

include = [
    "src/**/*",
    "build.rs",
    # The template bundle is embedded at compile time; without it the build
    # script has nothing to read and `cargo miden new` has no offline fallback.
    "templates.tar.gz",
    "README.md",
    "LICENSE*",
]

[lib]
doctest = false

[[bin]]
name = "cargo-miden"

[[test]]
name = "integration"
path = "tests/mod.rs"

[build-dependencies]
# Reads the bundle manifest out of the embedded archive, so the accepted
# template version has exactly one source of truth.
flate2.workspace = true

[dependencies]
midenc-compile = { workspace = true, features = ["std"] }
midenc-hir = { workspace = true, features = ["std"] }
midenc-session.workspace = true
midenc-log.workspace = true
log.workspace = true
clap.workspace = true
anyhow.workspace = true
path-absolutize = "^3.1"
toml_edit.workspace = true
heck.workspace = true
liquid = "0.26"
liquid-core = "0.26"
tempfile.workspace = true
walkdir = "2.5"
serde_json.workspace = true
# Verifies a downloaded template bundle against the digest GitHub reports.
sha2.workspace = true
