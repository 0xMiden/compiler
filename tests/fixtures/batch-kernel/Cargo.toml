cargo-features = ["trim-paths"]

[package]
name = "batch-kernel"
version = "0.1.0"
edition = "2024"

[lib]
# Build this crate as a self-contained, C-style dynamic library
# This is required to emit the proper Wasm module type
crate-type = ["cdylib"]

[dependencies]
miden-sdk-alloc = { path = "../../../sdk/alloc" }
miden-stdlib-sys = { path = "../../../sdk/stdlib-sys" }

[profile.release]
panic = "abort"
# optimize for size
opt-level = "z"
debug = false
trim-paths = ["diagnostics", "object"]

# Release code for the `batch_kernel_profile` cycle profiler (pairs with the `profiling` profile
# of `miden-project.toml`). Set `CARGO_PROFILE_PROFILING_DEBUG=line-tables-only` to resolve Rust
# source lines; it perturbs the generated code slightly, so it is not the default.
[profile.profiling]
inherits = "release"
