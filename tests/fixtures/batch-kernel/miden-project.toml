[package]
name = "batch-kernel"
version = "0.1.0"

[[bin]]
name = "batch-kernel"
path = "src/lib.rs"

[dependencies]
miden-core = "*"

# `release` code plus the package debug-info section, for the `batch_kernel_profile` cycle
# profiler and the benchmark flamegraphs (`DEBUG_PROFILE` in `benches/src/batch_kernel.rs`):
# callstack frame names and source locations in the debug executor.
[profile.profiling]
inherits = "release"
debug = true
