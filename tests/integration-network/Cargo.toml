[package]
name = "midenc-integration-network-tests"
# Never published; this version is deliberately frozen and meaningless.
version = "0.1.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
# Typed tx-script argument transport and felt-repr, for host-side argument mirrors
miden-field.workspace = true
miden-field-repr.workspace = true
miden-tx-script-args.workspace = true
# Temporary: the published client (0.17.0-rc.1) is built against protocol rc.5. Pinned to the
# rust-sdk rc.6 migration (https://github.com/0xMiden/rust-sdk/pull/2594) until a client release
# built on rc.6 is published.
miden-client = { git = "https://github.com/0xMiden/rust-sdk", rev = "5a13fac2a90d825451d335c3e67fd3538b3d9e52", features = ["std", "tonic", "testing"] }
miden-core.workspace = true
miden-protocol = { workspace = true, features = ["std", "testing"] }
miden-standards = { workspace = true, features = ["std", "testing"] }
miden-testing = { version = "=0.17.0-rc.6", features = ["std"] }
miden-mast-package.workspace = true
midenc-frontend-wasm.workspace = true
midenc-expect-test.workspace = true
rand = "0.10"
tokio.workspace = true

# For accessing shared compiler test builders and helpers
midenc-integration-test-support.workspace = true
