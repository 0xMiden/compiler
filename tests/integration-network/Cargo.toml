[package]
name = "midenc-integration-network-tests"
# Never published; this version is deliberately frozen and meaningless.
version = "0.1.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
# Typed tx-script argument transport and felt-repr, for host-side argument mirrors
miden-field.workspace = true
miden-field-repr.workspace = true
miden-tx-script-args.workspace = true
# TODO: switch back to a crates.io release once a Miden client compatible with
# protocol 0.17.0-rc.4 is published (tracked in 0xMiden/rust-sdk#2530).
miden-client = { git = "https://github.com/0xMiden/rust-sdk", rev = "4dbc8d53cb6f730cd2060492c8c68300d4a52962", features = ["std", "tonic", "testing"] }
miden-core.workspace = true
miden-protocol = { workspace = true, features = ["std", "testing"] }
miden-standards = { workspace = true, features = ["std", "testing"] }
miden-testing = { version = "=0.17.0-rc.4", features = ["std"] }
miden-mast-package.workspace = true
midenc-frontend-wasm.workspace = true
midenc-expect-test.workspace = true
rand = "0.10"
tokio.workspace = true

# For accessing shared compiler test builders and helpers
midenc-integration-test-support.workspace = true
