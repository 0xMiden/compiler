[package]
name = "midenc-integration-test-support"
# Never published; this version is deliberately frozen and meaningless.
version = "0.1.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
publish = false

[lib]
# `toolchain.rs` carries this crate's own unit tests (see `tests/support/src/testing/toolchain.rs`).
test = true
doctest = false

[dependencies]
anyhow.workspace = true
cargo-util = "0.2"
filetime = "0.2.23"
glob = "0.3.1"
miden-assembly.workspace = true
miden-core = { workspace = true, features = ["testing"] }
# VM host event handlers only; packages come from the toolchain.
miden-core-lib.workspace = true
miden-mast-package.workspace = true
miden-processor.workspace = true
miden-debug = { workspace = true, features = ["proptest", "std"] }
# The account-component packages staged into the test sysroot overlay.
miden-standards = { workspace = true, features = ["std"] }
midenc-expect-test.workspace = true
midenc-frontend-wasm.workspace = true
midenc-frontend-wasm-metadata.workspace = true
midenc-hir = { workspace = true, features = ["logging"] }
midenc-session.workspace = true
midenc-compile.workspace = true
proptest.workspace = true
sha2.workspace = true
thiserror.workspace = true
wit-parser.workspace = true
walkdir = "2.5.0"
