# Authoritative release policy for this repository.
#
# Every workspace package must appear here exactly once. Classification is
# explicit rather than inferred from directory layout, so that adding a package
# forces a deliberate decision about whether it is published.
#
# See tasks/design/release-tooling.md for the full design.

schema-version = 1

[units.compiler]
tag = "v{version}"
changelog = "CHANGELOG.md"

[units.sdk]
tag = "sdk/v{version}"
changelog = "sdk/CHANGELOG.md"

# Publishes an archive rather than crates, so no package is ever assigned to it.
# Its version lives in `extra/templates/bundle.toml`.
[units.templates]
tag = "templates/v{version}"
changelog = "extra/templates/CHANGELOG.md"

