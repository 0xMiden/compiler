# Authoritative release policy for this repository.
#
# Every workspace package must appear here exactly once. Classification is
# explicit rather than inferred from directory layout, so that adding a package
# forces a deliberate decision about whether it is published.
#
# See tools/release/README.md for the schema, and docs/release-process.md for
# this repository's process.

schema-version = 2

# Private packages are frozen here. A private crate carrying a plausible
# version invites the reader to assume it ships with the release.
private-version = "0.1.0"

# --- units --------------------------------------------------------------------

[units.sdk]
kind = "crates"
version-source = "own"
tag = "sdk/v{version}"
changelog = "sdk/CHANGELOG.md"
changelog-headings = ["Added", "Changed", "Fixed", "Migration and breaking changes"]

# Publishes an archive rather than crates, so no package is ever assigned to it.
# Its version lives in `extra/templates/bundle.toml`.
[units.templates]
kind = "artifact"
tag = "templates/v{version}"
changelog = "extra/templates/CHANGELOG.md"
changelog-headings = ["Templates", "SDK compatibility"]
assets = ["templates.tar.gz"]

[units.templates.source]
directory = "extra/templates"
# The manifest is the include list: the archive must contain everything
# `cargo miden new` renders from and nothing else. Repository furniture beside
# the templates would confuse a generated project or fail to resolve outside
# this repository.
manifest = "bundle.toml"
asset = "templates.tar.gz"
embedded-copy = "tools/cargo-miden/templates.tar.gz"

# The templates hardcode an SDK requirement, so an SDK bump must carry them
# along or generated projects stay pinned to the previous SDK. Silent when
# missed: the templates still render and still build. This declares the
# rewriting and the publish order; whether a given SDK release *forces* a
# templates release is decided from content, in `candidate::validate`.
[units.templates.tracks.sdk]
packages = ["miden", "miden-sdk-build-script-support"]

[units.compiler]
kind = "crates"
version-source = "workspace"
tag = "v{version}"
changelog = "CHANGELOG.md"
changelog-headings = [
    "Compiler and `midenc`",
    "`cargo-miden`",
    "`miden-objtool`",
    "Libraries and public APIs",
    "Migration and breaking changes",
]
after = ["sdk", "templates"]
latest = true
# The release workflow's matrix builds `${binary}-${target}.tar.gz` for three
# binaries across two targets. All six route here.
assets = ["midenc-*.tar.gz", "cargo-miden-*.tar.gz", "miden-objtool-*.tar.gz"]
required-assets = ["midenc-*.tar.gz"]

# Repository infrastructure, never published.
[units.private]
kind = "private"

