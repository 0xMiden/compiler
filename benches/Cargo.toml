[package]
name = "midenc-benchmark-runner"
# Never published; this version is deliberately frozen and meaningless.
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Benchmarks for the Miden compiler"
publish = false

[lib]
doctest = false

[[bin]]
name = "example-benchmarks"
path = "src/main.rs"

[[bin]]
name = "contract-benchmarks"
path = "src/bin/contract-benchmarks.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
miden-assembly.workspace = true
miden-core.workspace = true
miden-debug = { workspace = true, features = ["std", "flamegraph"] }
miden-mast-package.workspace = true
miden-processor.workspace = true
miden-protocol = { workspace = true, features = ["std", "testing"] }
miden-standards = { workspace = true, features = ["std", "testing"] }
miden-testing = { workspace = true, features = ["std"] }
miden-tx = { version = "=0.16.0-rc.4" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
