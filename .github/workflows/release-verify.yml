# The substantive release checks, factored out so that pull requests, rehearsals,
# and production all run the *same* logic rather than three approximations of it.
#
# This workflow holds no credentials and can reach no production service. It is
# called by `release-ci.yml` on pull requests and by `release.yml` in production.
name: release-verify

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to verify.
        required: true
        type: string
      full:
        description: Run the expensive closure verification.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  lint:
    name: release lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          # Baseline tags and merge-base checks need real history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version

      - name: Build release-tool
        run: cargo build -p midenc-release

      # Package classification, publishability, private-dependency edges, the
      # frozen private-crate versions, and active `[patch]` entries. An active
      # patch is the most likely way to publish a broken crate: the workspace
      # builds, the normalized manifest looks correct, and the published crate
      # resolves to a registry version without the patched behaviour.
      - name: Lint release configuration
        run: ./target/debug/release-tool lint

      - name: Check publication order is derivable
        run: ./target/debug/release-tool package-order

      - name: Release-tool tests
        run: cargo test -p midenc-release

      - name: Formatting and lints
        run: |
          cargo fmt -p midenc-release -- --check
          cargo clippy -p midenc-release --all-targets -- -D warnings

  closure:
    name: package closure
    # Expensive: it packages every selected crate and builds a consumer that
    # resolves only through a registry. That build is the only thing proving the
    # archives are usable, because production publishes with `--no-verify`.
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version

      - name: Build release-tool
        run: cargo build -p midenc-release

      - name: Verify the package closure
        run: ./target/debug/release-tool verify-closure --cache-dir "${RUNNER_TEMP}/index-cache"

  workflow-policy:
    name: workflow policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # These assertions are the difference between a security model and a
      # comment describing one. Each corresponds to a way the release path could
      # silently lose a property it depends on.
      - name: Assert release workflow invariants
        run: |
          set -euo pipefail
          fail() { echo "workflow-policy: $1" >&2; exit 1; }

          # Only the production workflow may enter the production environment.
          # Match the `environment:` key rather than any mention of the name, so
          # that this check does not trip over its own search pattern.
          for wf in .github/workflows/*.yml; do
            case "$(basename "$wf")" in
              release.yml) ;;
              *) grep -Eq '^[[:space:]]+environment:[[:space:]]*release-production' "$wf" && \
                   fail "$wf enters the production environment" ;;
            esac
          done

          # Production must not accept scope or versions as inputs; the scope
          # comes from the reviewed .release/release.toml and nothing else.
          if [ -f .github/workflows/release.yml ]; then
            grep -Eq '^\s+(version|unit|units|scope):' .github/workflows/release.yml && \
              fail "release.yml accepts scope or version inputs"
          fi

          # The token must never appear on a command line.
          grep -rn -- '--token' .github/workflows/ | grep -v 'rehearsal' && \
            fail "a token is passed as a command-line argument" || true

          # No long-lived registry secret in the new release path.
          #
          # `release-plz.yml` is exempt because it *is* the old path: it uses a
          # long-lived token, which is one of the reasons it is being replaced.
          # It stays until the new path has been rehearsed and used for a
          # supervised release, and it must be disabled before the first
          # production pilot -- two live publication paths is how a release gets
          # published twice.
          for wf in .github/workflows/*.yml; do
            case "$(basename "$wf")" in
              release-plz.yml) continue ;;
            esac
            grep -q 'secrets\.CARGO_REGISTRY_TOKEN' "$wf" && \
              fail "$wf references a long-lived crates.io secret" || true
          done

          if [ -f .github/workflows/release-plz.yml ]; then
            echo "workflow-policy: NOTE the legacy release-plz path is still present;" \
                 "disable it before the first production release"
          fi

          echo "workflow-policy: ok"

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color
